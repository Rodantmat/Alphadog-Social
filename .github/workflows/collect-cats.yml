name: collect-cats
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Folder label on footage branch"
        default: "cats-commons"
      max_dl:
        description: "Max videos to download"
        default: "30"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -U "yt-dlp[default,curl-cffi]"
      - name: Collect
        run: python scripts/collect_cats.py "/tmp/out/${{ inputs.label }}" "${{ inputs.max_dl }}"
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin footage && git checkout footage
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/out/${{ inputs.label }}/. "${{ inputs.label }}/"
          git add "${{ inputs.label }}" && git commit -m "cat footage: ${{ inputs.label }}" && git push origin footage
