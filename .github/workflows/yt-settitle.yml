name: yt-settitle
# Set titles of PRIVATE videos only (scripts/yt_settitle.py). pairs = JSON {"videoId":"new title"}
on:
  workflow_dispatch:
    inputs:
      pairs: { description: "JSON object videoId -> title", required: true }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PAIRS: ${{ inputs.pairs }}
        run: python3 scripts/yt_settitle.py
