name: transcribe
on:
  workflow_dispatch:
    inputs:
      folders:
        description: "space-separated footage-branch folders"
        default: "yt-audio stock-audio"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: footage
          path: fb
          sparse-checkout: ${{ inputs.folders }}
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper numpy
      - run: cd fb && python ../main/scripts/transcribe.py ${{ inputs.folders }}
      - name: Push
        run: |
          cd fb; git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A . && git commit -m "transcripts" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin footage && git push origin HEAD:footage && exit 0; sleep $((i*10)); done; exit 1
