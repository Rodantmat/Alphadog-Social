name: yt-unschedule
# Cancel the scheduled publish of replaced uploads (they stay private) and remove them from the series playlist.
on:
  workflow_dispatch:
    inputs:
      ids: { description: "comma-separated video ids", required: true }
      playlist: { default: "PLBVXw4D9bxc0" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IDS: ${{ inputs.ids }}
          PL: ${{ inputs.playlist }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          d = urllib.parse.urlencode({"client_id": os.environ["YT_CLIENT_ID"], "client_secret": os.environ["YT_CLIENT_SECRET"],
                                      "refresh_token": os.environ["YT_REFRESH_TOKEN"], "grant_type": "refresh_token"}).encode()
          tok = json.loads(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token", data=d)).read())["access_token"]
          def api(method, url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, method=method,
                                         headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as x: b = x.read(); return x.status, (json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:400]
          def status(v): return api("GET", f"https://www.googleapis.com/youtube/v3/videos?part=status&id={v}")[1]["items"][0]["status"]
          base = {"selfDeclaredMadeForKids": False, "embeddable": True, "license": "youtube"}
          for v in os.environ["IDS"].split(","):
              print(v, "before", status(v))
              print(" null publishAt:", api("PUT", "https://www.googleapis.com/youtube/v3/videos?part=status", {"id": v, "status": dict(base, privacyStatus="private", publishAt=None)})[0])
              s = status(v)
              if s.get("publishAt"):
                  print(" unlisted:", api("PUT", "https://www.googleapis.com/youtube/v3/videos?part=status", {"id": v, "status": dict(base, privacyStatus="unlisted")})[0])
                  print(" private:", api("PUT", "https://www.googleapis.com/youtube/v3/videos?part=status", {"id": v, "status": dict(base, privacyStatus="private")})[0])
                  s = status(v)
              print(v, "AFTER", s, "| still scheduled!" if s.get("publishAt") else "| unscheduled OK")
          st, out = api("GET", f"https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId={os.environ['PL']}")
          for it in out.get("items", []):
              if it["snippet"]["resourceId"].get("videoId") in os.environ["IDS"].split(","):
                  print("remove from playlist", it["snippet"]["resourceId"]["videoId"], api("DELETE", f"https://www.googleapis.com/youtube/v3/playlistItems?id={it['id']}")[0])
          PY
