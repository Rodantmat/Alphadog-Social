name: modal-t2i
# Stills on Modal (Qwen-Image, A100-80GB). Paid only from the free monthly allowance: usage limit $30, spend limit $0.
# Hard caps in the script: max 30 images per run, 1 container, 1 attempt, no Volumes.
# Job lists can be a committed JSON or one written on the runner by scripts/ai_samples/gen_ep1_stills.py
# (content/chiricahua/gen/stills_<passage>.json). Output + automatic review committed to review/<label>/ on main.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "repo path of the jobs JSON"
        default: "content/chiricahua/qwen_A01.json"
      modal_key:
        description: "Modal key set: W1..W4 (weekly $30 budgets), MAIN or BACKUP (backups only if the week's key is exhausted)"
        default: "W1"
      label:
        default: "A01qwen"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ inputs.modal_key == 'MAIN' && secrets.MODAL_TOKEN_ID || secrets[format('MODAL_TOKEN_ID_{0}', inputs.modal_key)] }}
      MODAL_TOKEN_SECRET: ${{ inputs.modal_key == 'MAIN' && secrets.MODAL_TOKEN_SECRET || secrets[format('MODAL_TOKEN_SECRET_{0}', inputs.modal_key)] }}
    steps:
      - name: Check Modal key
        run: '[ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::Modal key set ${{ inputs.modal_key }} not found in secrets"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal ultralytics pillow
      - name: Generate episode still job lists
        run: python3 scripts/ai_samples/gen_ep1_stills.py content/chiricahua/gen
      - name: Render on Modal
        run: modal run scripts/modal/modal_t2i.py --jobs "${{ inputs.jobs }}" --out out
      - name: Review (counts + contact sheet)
        if: always()
        run: |
          ls out/*.jpg >/dev/null 2>&1 || exit 0
          python3 scripts/ai_samples/review_stills.py "${{ inputs.jobs }}" out rev
      - name: Commit to main
        if: always()
        run: |
          ls out/*.jpg >/dev/null 2>&1 || exit 0
          R="review/${{ inputs.label }}"
          mkdir -p "$R" && cp out/*.jpg "$R/" && cp rev/* "$R/" 2>/dev/null || true
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add review && git commit -qm "review ${{ inputs.label }} (modal qwen-image)" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
      - name: Modal spend so far this month (this key's workspace)
        if: always()
        run: |
          modal billing report --for "this month" --show-resources | tee /tmp/bill.txt || true
          python3 -c "import re;t=open('/tmp/bill.txt').read();v=[float(x) for x in re.findall(r'│\s*([0-9.]+(?:E-?[0-9]+)?)\s*│\s*$',t,re.M)];print('MODAL_MONTH_TOTAL_USD',round(sum(v),4))" || true
          modal billing report --for today --resolution h --show-resources || true
