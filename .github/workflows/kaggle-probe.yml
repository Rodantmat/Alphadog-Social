name: kaggle-probe
# Checks the Kaggle API token (secret KAGGLE_API_TOKEN, never printed), finds the username, then runs a tiny GPU+internet
# kernel (nvidia-smi + pip check) and downloads its output. Nothing is published.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -U "kaggle>=1.8" && kaggle --version
      - name: Who am I
        run: |
          python3 - <<'EOF'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          cv = getattr(api, "config_values", {}) or {}
          print("USERNAME", cv.get("username") or api.get_config_value("username"))
          EOF
          kaggle kernels list --mine --page-size 5 || true
      - name: Push GPU test kernel
        run: |
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K;a=K();a.authenticate();print((getattr(a,'config_values',{}) or {}).get('username') or a.get_config_value('username'))")
          echo "U=$U" >> $GITHUB_ENV
          mkdir -p k && cd k
          cat > run.py <<'EOF'
          import subprocess, torch, sys
          print("TORCH", torch.__version__, "CUDA", torch.cuda.is_available(), torch.cuda.device_count())
          for i in range(torch.cuda.device_count()): print("GPU", i, torch.cuda.get_device_name(i))
          print(subprocess.run(["nvidia-smi"], capture_output=True, text=True).stdout)
          r = subprocess.run([sys.executable, "-m", "pip", "download", "--no-deps", "-q", "ftfy", "-d", "/tmp/x"], capture_output=True, text=True)
          print("INTERNET_OK" if r.returncode == 0 else "INTERNET_FAIL " + r.stderr[-300:])
          open("/kaggle/working/probe.txt", "w").write("ok\n")
          EOF
          cat > kernel-metadata.json <<EOF
          {"id": "$U/alphadog-gpu-probe", "title": "alphadog gpu probe", "code_file": "run.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          EOF
          kaggle kernels push -p .
      - name: Wait for it
        run: |
          for i in $(seq 1 40); do
            s=$(kaggle kernels status "$U/alphadog-gpu-probe" 2>&1 | tail -1); echo "$(date +%T) $s"
            echo "$s" | grep -qiE "complete|error|cancel" && break; sleep 30
          done
          mkdir -p out && kaggle kernels output "$U/alphadog-gpu-probe" -p out || true
          ls -la out; cat out/*.log 2>/dev/null | tail -40 || true; find out -name "*.txt" -exec cat {} \;
