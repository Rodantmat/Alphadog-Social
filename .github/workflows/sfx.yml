name: sfx
on:
  workflow_dispatch:
    inputs:
      label:
        default: "sfx"
      config:
        default: "content/chiricahua/sfx_config.json"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install curl_cffi
      - run: python scripts/sfx_collect.py "/tmp/out/${{ inputs.label }}" "${{ inputs.config }}"
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin footage && git checkout footage
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/out/${{ inputs.label }}/. "${{ inputs.label }}/" || true
          git add "${{ inputs.label }}" && git commit -m "sfx: ${{ inputs.label }}" || { echo "nothing"; exit 0; }
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin footage && git push origin footage && exit 0; sleep $((i*10)); done; exit 1
