name: yt-account-language
# One-off: set the AlphaDog Studio Google account's UI language to English (US) via the saved session.
# step=youtube (Studio + youtube.com menus) or step=google (myaccount.google.com/language). Stops on any verify/password page.
on:
  workflow_dispatch:
    inputs:
      step: { description: "youtube | google", default: "youtube" }
      dry_run: { description: "1 = open menus and back out", default: "1" }
permissions:
  contents: write
concurrency: { group: yt-studio-session, cancel-in-progress: false }
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  lang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright cryptography && python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          YT_STUDIO_SESSION: ${{ secrets.YT_STUDIO_SESSION }}
          YT_GOOGLE_SESSION: ${{ secrets.YT_GOOGLE_SESSION }}
          STEP: ${{ inputs.step }}
          DRY_RUN: ${{ inputs.dry_run }}
          QA_DIR: /tmp/ytqa
        run: xvfb-run -a python3 scripts/yt_account_language.py
      - name: Save refreshed session
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add content/private/yt_studio_session.enc && git commit -qm "yt-studio: session refreshed (language)" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
      - if: always()
        name: Publish QA to release studio-qa
        run: |
          [ -d /tmp/ytqa ] || exit 0
          mkdir -p /tmp/rel && for f in /tmp/ytqa/*; do cp "$f" "/tmp/rel/lang_${{ github.run_id }}_$(basename "$f")"; done; cd /tmp/rel
          gh release upload studio-qa -R "$GITHUB_REPOSITORY" lang_${{ github.run_id }}_* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/studio-qa" -q '.assets[] | select(.name | test("_00_studio")) | .id' | while read id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
