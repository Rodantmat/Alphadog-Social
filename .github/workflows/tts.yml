name: tts
on:
  workflow_dispatch:
    inputs:
      segments:
        description: "Path to segments JSON in repo"
        required: true
      label:
        description: "Output folder on footage branch"
        required: true
      voices:
        description: "Comma-separated Kokoro voices"
        default: "am_michael"
      speed:
        default: "0.95"
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -y && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install "kokoro>=0.9.4" soundfile torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Narrate
        run: python scripts/tts_kokoro.py "${{ inputs.segments }}" "/tmp/out/${{ inputs.label }}" "${{ inputs.voices }}" "${{ inputs.speed }}"
      - name: Compress to m4a
        run: |
          cd /tmp/out/${{ inputs.label }}
          for f in */*.wav; do ffmpeg -v error -y -i "$f" -c:a aac -b:a 160k "${f%.wav}.m4a" && rm "$f"; done
      - name: Push to footage branch (sparse clone; retries)
        if: always()
        run: |
          L="${{ inputs.label }}"
          git clone -q --depth 1 --filter=blob:none --sparse --branch footage "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/fb
          cd /tmp/fb && git sparse-checkout set "$L" && mkdir -p "$L" && cp -r /tmp/out/$L/. "$L/"
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add "$L" && git commit -qm "tts: $L" || { echo "nothing to push"; exit 0; }
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase --depth 1 origin footage && git push -q origin HEAD:footage && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 8))
          done
          exit 1
