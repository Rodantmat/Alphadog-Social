<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlphaDog Picks · Connected</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.6;color:#0f2039;background:#f6f3ec}code{display:block;word-break:break-all;background:#0f2039;color:#f6f3ec;padding:12px;border-radius:8px;margin:12px 0}button{font-size:16px;padding:10px 18px;border-radius:999px;border:0;background:#beff46;font-weight:700}</style></head>
<body>
<h1>Authorization received</h1>
<p id="msg">Reading the authorization code…</p>
<code id="code"></code>
<button id="copy" hidden>Copy code</button>
<p>Save this code as the GitHub secret <b>TIKTOK_AUTH_CODE</b> in Alphadog-Social within a few minutes (it expires quickly), then tell Claude "code saved".</p>
<script>
const q = new URLSearchParams(location.search);
const c = q.get("code"), e = q.get("error");
document.getElementById("msg").textContent = c ? "Authorization code:" : ("No code received" + (e ? (": " + e) : "."));
if (c) { document.getElementById("code").textContent = c; const b = document.getElementById("copy"); b.hidden = false;
  b.onclick = () => { try { navigator.clipboard.writeText(c); b.textContent = "Copied"; } catch (x) {} }; }
</script>
</body></html>
