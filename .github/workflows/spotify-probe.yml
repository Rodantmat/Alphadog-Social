name: spotify-probe
# Read-only: does the saved Spotify for Creators session work from a GitHub runner? Takes no actions on the account.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          SPOTIFY_CREATORS_SESSION: ${{ secrets.SPOTIFY_CREATORS_SESSION }}
        run: python3 scripts/spotify_probe.py
