name: collect-player
on:
  workflow_dispatch:
    inputs:
      regex:
        description: "Title regex, e.g. Rui|Hachimura"
        required: true
      max_items:
        description: "Posts to scan per account"
        default: "150"
      label:
        description: "Folder label"
        required: true
      accounts:
        description: "Space-separated TikTok handles"
        required: true
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -U "yt-dlp[default,curl-cffi]"
      - name: Collect
        run: python scripts/collect_player.py "${{ inputs.regex }}" "${{ inputs.max_items }}" "/tmp/out/${{ inputs.label }}" ${{ inputs.accounts }}
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin footage && git checkout footage
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/out/${{ inputs.label }}/. "${{ inputs.label }}/"
          git add "${{ inputs.label }}" && git commit -m "player footage: ${{ inputs.label }}" && git push origin footage
