name: yt-publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag holding the media + meta_*.json files (ignored when footage_dir is set)"
        default: ""
      only:
        description: "optional: a single meta file name to run (e.g. meta_long.json)"
        default: ""
      footage_dir:
        description: "optional: folder on the footage branch holding media + metas (used instead of the release), e.g. yellowstone-shorts/ch1"
        default: ""
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rel && cd /tmp/rel
          if [ -n "${{ inputs.footage_dir }}" ]; then
            git clone -q --depth 1 --filter=blob:none --sparse --branch footage "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fbs
            (cd /tmp/fbs && git sparse-checkout set --no-cone "/${{ inputs.footage_dir }}") && cp /tmp/fbs/${{ inputs.footage_dir }}/* /tmp/rel/
          else
            gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -D /tmp/rel
          fi
          ls -la /tmp/rel
      - name: Upload to YouTube (long video, captions, localizations, thumbnail, playlist, credits; scheduled Shorts)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          cd /tmp/rel
          for m in $(ls meta_*.json | sort); do
            if [ -n "${{ inputs.only }}" ] && [ "$m" != "${{ inputs.only }}" ]; then continue; fi
            echo "=== $m"; python $GITHUB_WORKSPACE/scripts/yt_upload.py "$m"
          done
      - name: Save queued comments
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add content/pending 2>/dev/null; git commit -qm "yt-publish: queued comments" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
