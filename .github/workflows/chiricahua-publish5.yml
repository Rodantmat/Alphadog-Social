name: chiricahua-publish5
# Publish the release artifact of a finished chiricahua-v5 run (long video, 6 subtitle tracks, localized titles, thumbnail, credits).
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "chiricahua-v5 run id whose release artifact to publish"
        required: true
      publish_at:
        description: "optional premiere time, UTC (e.g. 2026-10-26T18:00:00Z); empty keeps the release metadata"
        default: ""
      resume_video_id:
        description: "optional: video already uploaded - skip the upload and finish playlist, captions, localizations, comment"
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo mkdir -p /home/claude && sudo chown "$(id -u):$(id -g)" /home/claude && mkdir -p /home/claude/doc/chiricahua/release /home/claude/doc/runner5
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: /home/claude/doc/chiricahua/release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - run: ls -la /home/claude/doc/chiricahua/release && python3 ci/chiricahua5/unpack5.py /home/claude/doc/runner5
      - name: Set the schedule (publish_at must still be >= 1 h ahead, else go public now)
        env:
          AT: ${{ inputs.publish_at }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as d
          p = "/home/claude/doc/chiricahua/release/meta_0_long.json"; m = json.load(open(p))
          if os.environ.get("AT"): m["publish_at"] = os.environ["AT"]; m["privacy"] = "private"
          a = m.get("publish_at")
          if a and d.datetime.fromisoformat(a.replace("Z", "+00:00")) - d.datetime.now(d.timezone.utc) < d.timedelta(hours=1):
              m.pop("publish_at"); m["privacy"] = "public"
          json.dump(m, open(p, "w"), ensure_ascii=False, indent=1); print(m.get("privacy"), m.get("publish_at"))
          PY
      - name: Publish to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RESUME_VIDEO_ID: ${{ inputs.resume_video_id }}
        run: bash /home/claude/doc/runner5/ci/publish5.sh
      - name: Record video ID / queued comment in repo
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add content/published content/pending 2>/dev/null || true
          git commit -qm "published: chiricahua ep1" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
