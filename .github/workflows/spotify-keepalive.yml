name: spotify-keepalive
# Keeps the Spotify for Creators session fresh: a read-only visit to the dashboard twice a week, then the refreshed
# cookies are saved encrypted (content/private/spotify_session.enc). If the session has died, the run fails -> owner re-exports.
on:
  schedule:
    - cron: "41 17 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright cryptography && python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          SPOTIFY_CREATORS_SESSION: ${{ secrets.SPOTIFY_CREATORS_SESSION }}
        run: python3 scripts/spotify_session.py keepalive
      - name: Save refreshed session
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add content/private/spotify_session.enc && git commit -qm "spotify: session refreshed" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
