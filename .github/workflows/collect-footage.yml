name: collect-footage
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Window start (unix seconds)"
        required: true
      until:
        description: "Window end (unix seconds)"
        required: true
      label:
        description: "Folder label, e.g. 2026-10-20"
        required: true
      accounts:
        description: "Space-separated TikTok handles"
        default: "nba celtics detroitpistons sixers nyknicks okcthunder spurs"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -U "yt-dlp[default,curl-cffi]"
      - name: Collect
        run: python scripts/collect_footage.py "${{ inputs.since }}" "${{ inputs.until }}" "/tmp/footage/${{ inputs.label }}" ${{ inputs.accounts }}
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin footage; then
            git fetch origin footage && git checkout footage
          else
            git checkout --orphan footage && git rm -rf . -q
          fi
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/footage/${{ inputs.label }}/. "${{ inputs.label }}/"
          git add "${{ inputs.label }}" && git commit -m "footage: ${{ inputs.label }}" && git push origin footage
