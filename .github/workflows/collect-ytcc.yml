name: collect-ytcc
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Folder label on footage branch"
        default: "ytcc-probe"
      qfile:
        description: "Queries file (one per line)"
        default: "content/chiricahua/yt_queries_probe.txt"
      per_query:
        description: "Search results per query"
        default: "8"
      max_dl:
        description: "Max videos to download"
        default: "3"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -U "yt-dlp[default,curl-cffi]"
      - name: Collect
        run: python scripts/collect_ytcc.py "/tmp/out/${{ inputs.label }}" "${{ inputs.per_query }}" "${{ inputs.max_dl }}" "@${{ inputs.qfile }}"
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin footage && git checkout footage
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/out/${{ inputs.label }}/. "${{ inputs.label }}/" || true
          git add "${{ inputs.label }}" && git commit -m "footage: ${{ inputs.label }}" && git push origin footage || echo "nothing to push"
