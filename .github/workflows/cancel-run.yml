name: cancel-run
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id to cancel"
        required: true
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ inputs.run_id }}" -R "${{ github.repository }}" && echo CANCELLED
