name: yt-link
# Cloud job: sets the Related video (Short -> its full documentary) in Studio with the saved Studio session. No public API exists for it.
on:
  workflow_dispatch:
    inputs:
      video_ids: { description: "comma list of Short ids, or auto (all public Shorts)", default: "auto" }
      dry: { description: "1 = report only", default: "0" }
permissions:
  contents: write
concurrency: { group: yt-studio-session, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright cryptography && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Link
        env:
          YT_STUDIO_SESSION: ${{ secrets.YT_STUDIO_SESSION }}
          YT_GOOGLE_SESSION: ${{ secrets.YT_GOOGLE_SESSION }}
          VIDEO_IDS: ${{ inputs.video_ids }}
          DRY: ${{ inputs.dry }}
        run: xvfb-run -a python3 scripts/yt_studio_link.py
      - if: always()
        name: Save rolling session
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add content/private/yt_studio_session.enc 2>/dev/null; git commit -qm "yt-link: session" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*4)); done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: link-${{ github.run_id }}, path: /tmp/ytqa, retention-days: 7, if-no-files-found: ignore }
