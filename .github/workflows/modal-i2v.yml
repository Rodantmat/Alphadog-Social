name: modal-i2v
# Image-to-video on Modal (Wan2.2 TI2V-5B, L4 GPU). Paid only from the free monthly allowance: account usage limit $30,
# spend limit $0. Hard caps in the script: max 8 jobs per run, 4 containers, 1 attempt each, no Volumes.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "repo path of the jobs JSON"
        default: "content/chiricahua/modal_jobs_i2v1.json"
      modal_key:
        description: "Modal key set: W1..W4 (project budgets), then backups in order MAIN, BACKUP, BACKUP2, BACKUP3 (each until empty). Secrets MODAL_TOKEN_ID_<KEY>/MODAL_TOKEN_SECRET_<KEY>; MAIN uses MODAL_TOKEN_ID/MODAL_TOKEN_SECRET"
        default: "W1"
      label:
        default: "i2v1"
      dest:
        description: "folder on the footage branch for the clips (label is appended)"
        default: "samples/ai-modal"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ inputs.modal_key == 'MAIN' && secrets.MODAL_TOKEN_ID || secrets[format('MODAL_TOKEN_ID_{0}', inputs.modal_key)] }}
      MODAL_TOKEN_SECRET: ${{ inputs.modal_key == 'MAIN' && secrets.MODAL_TOKEN_SECRET || secrets[format('MODAL_TOKEN_SECRET_{0}', inputs.modal_key)] }}
    steps:
      - name: Check Modal key
        run: '[ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::Modal key set ${{ inputs.modal_key }} not found in secrets"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal
      - name: Render on Modal
        run: modal run scripts/modal/modal_i2v.py --jobs "${{ inputs.jobs }}" --out out
      - name: Push clips to footage branch
        if: always()
        run: |
          ls out/*.mp4 >/dev/null 2>&1 || exit 0
          L="${{ inputs.dest }}/${{ inputs.label }}"
          git clone -q --depth 1 --filter=blob:none --sparse --branch footage "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fb
          cd /tmp/fb && git sparse-checkout set "$L" && mkdir -p "$L" && cp $GITHUB_WORKSPACE/out/*.mp4 "$L/"
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add "$L" && git commit -qm "ai clips: modal ${{ inputs.label }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase --depth 1 origin footage && git push -q origin HEAD:footage && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*9)); done; exit 1
      - name: Modal spend so far this month (this key's workspace)
        if: always()
        run: |
          modal billing report --for "this month" --show-resources | tee /tmp/bill.txt || true
          python3 -c "import re;t=open('/tmp/bill.txt').read();v=[float(x) for x in re.findall(r'│\s*([0-9.]+(?:E-?[0-9]+)?)\s*│\s*$',t,re.M)];print('MODAL_MONTH_TOTAL_USD',round(sum(v),4))" || true
          modal billing report --for today --resolution h --show-resources || true
