name: ai-stills-cn
# Layout-controlled stills (SDXL + Canny ControlNet on a drawn layout), free CPU.
# Stills go to samples/ai-stills/<label>/ on the footage branch; then an automatic count review goes to review/<label>/ on main.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "repo path of the stills JSON"
        default: "content/chiricahua/still_cn_A01.json"
      label:
        default: "A01cn"
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow
      - run: python3 scripts/ai_samples/stills_cn.py /tmp/out ${{ matrix.part }} 3 "${{ inputs.jobs }}"
      - name: Push to footage branch
        run: |
          L="samples/ai-stills/${{ inputs.label }}"
          git clone -q --depth 1 --filter=blob:none --sparse --branch footage "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fb
          cd /tmp/fb && git sparse-checkout set "$L" && mkdir -p "$L" && cp /tmp/out/* "$L/"
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add samples && git commit -qm "ai stills cn ${{ inputs.label }} part ${{ matrix.part }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase --depth 1 origin footage && git push -q origin HEAD:footage && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*7+${{ matrix.part }})); done; exit 1
  review:
    needs: make
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q ultralytics pillow
      - name: Fetch stills from footage branch
        run: |
          L="samples/ai-stills/${{ inputs.label }}"
          git clone -q --depth 1 --filter=blob:none --sparse --branch footage "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fb
          cd /tmp/fb && git sparse-checkout set "$L" && mkdir -p /tmp/in && cp "$L"/* /tmp/in/
      - name: Review (counts + contact sheet)
        run: python3 scripts/ai_samples/review_stills.py "${{ inputs.jobs }}" /tmp/in /tmp/rev
      - name: Commit review to main
        run: |
          R="review/${{ inputs.label }}"
          mkdir -p "$R" && cp /tmp/rev/* "$R/" && cp /tmp/in/*.jpg "$R/"
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add review && git commit -qm "review ${{ inputs.label }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
