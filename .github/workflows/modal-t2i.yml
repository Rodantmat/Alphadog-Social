name: modal-t2i
# Stills on Modal (Qwen-Image, A100-80GB). Paid only from the free monthly allowance: usage limit $30, spend limit $0.
# Hard caps in the script: max 12 images per run, 1 container, 1 attempt, no Volumes.
# Output + automatic review (person counts + contact sheet) committed to review/<label>/ on main.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "repo path of the jobs JSON"
        default: "content/chiricahua/qwen_A01.json"
      label:
        default: "A01qwen"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal ultralytics pillow
      - name: Render on Modal
        run: modal run scripts/modal/modal_t2i.py --jobs "${{ inputs.jobs }}" --out out
      - name: Review (counts + contact sheet)
        if: always()
        run: |
          ls out/*.jpg >/dev/null 2>&1 || exit 0
          python3 scripts/ai_samples/review_stills.py "${{ inputs.jobs }}" out rev
      - name: Commit to main
        if: always()
        run: |
          ls out/*.jpg >/dev/null 2>&1 || exit 0
          R="review/${{ inputs.label }}"
          mkdir -p "$R" && cp out/*.jpg "$R/" && cp rev/* "$R/" 2>/dev/null || true
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add review && git commit -qm "review ${{ inputs.label }} (modal qwen-image)" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
