name: collect-stock
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Folder label on footage branch"
        required: true
      queries:
        description: "Pipe-separated search queries"
        required: true
      max_per_query:
        description: "Max clips per query per site"
        default: "12"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -U curl-cffi
      - name: Collect
        run: python scripts/collect_stock.py "/tmp/out/${{ inputs.label }}" "${{ inputs.max_per_query }}" "${{ inputs.queries }}"
      - name: Push to footage branch
        if: always()
        run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin footage && git checkout footage
          mkdir -p "${{ inputs.label }}" && cp -r /tmp/out/${{ inputs.label }}/. "${{ inputs.label }}/"
          git add "${{ inputs.label }}" && git commit -m "stock footage: ${{ inputs.label }}" && git push origin footage
